<mat-form-field [class]="field().class ?? ''">
  @if (field().label) {
    <mat-label>{{ field().label }}</mat-label>
  }
  <textarea
    matInput
    [cols]="field().cols"
    [rows]="field().rows"
    [formField]="field().formField"
    [placeholder]="field().placeholder ?? ''"
  ></textarea>
</mat-form-field>
